[versions]
agp = "9.4.1"
kotlin = "2.4.21"
# Pinned on evidence: 1.12.0-alpha01 stalled ~20 s after seeking forward on the TV; 1.11.1 didn't (DESIGN.md).
# Every media3 module must be the same version. Rerun tv-agent's player test script before changing it.
media3 = "1.11.1"
profileinstaller = "1.4.1"
junit = "4.13.2"
json = "20260814"

[libraries]
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# The JVM tests run against Android's API stubs; this is the real org.json in their place.
json = { group = "org.json", name = "json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 compiles Kotlin itself; declared (not applied) so the build uses this Kotlin rather than AGP's default one.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
