# A tag vX.Y.Z builds the release APK, signed with the release key from the repo secrets, and publishes a GitHub
# Release with it, SHA256SUMS and that version's CHANGELOG section. See RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Build and check the signature
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TV_AGENT_PLAYER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TV_AGENT_PLAYER_KEY_ALIAS: tv-agent
          # The release key's certificate (tv-agent's, see RELEASING.md): an APK signed with any other isn't published.
          CERT_SHA256: bd934e07d6784766bbfb3948bf3467ef9b2cb0c9c1146fdf9528dc76c8eb1e08
        run: |
          v="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          [ "$have" = "$v" ] || { echo "app/build.gradle.kts says $have"; exit 1; }
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "the ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          export TV_AGENT_PLAYER_KEYSTORE="$RUNNER_TEMP/release.p12"
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$TV_AGENT_PLAYER_KEYSTORE"
          ./gradlew testDebugUnitTest assembleRelease --console=plain
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk" 2>&1) || { echo "$certs"; exit 1; }
          grep -qE "certificate SHA-256 digest: $CERT_SHA256\s*$" <<< "$certs" \
            || { echo "$apk isn't signed with the release key:"; grep -i "signer" <<< "$certs"; exit 1; }
          mkdir -p dist
          cp "$apk" "dist/tv-agent-player-$v.apk"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          # This version's CHANGELOG section ("## X.Y.Z — date" up to the next "## ").
          awk -v v="$v" '/^## / { on = index($0, "## " v " ") == 1; next } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no ## $v section"; exit 1; }
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --title "TV Agent Player $v" --notes-file notes.md
