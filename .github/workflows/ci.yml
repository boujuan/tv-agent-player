# Builds the app (debug, and release to catch R8 problems), runs its unit tests and lint on every push to main and
# every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # The runner's Android SDK (ANDROID_HOME) has the platform; Gradle resolves the libraries. Without the release
      # key here, the release build is signed with the runner's debug key.
      - run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug --console=plain
